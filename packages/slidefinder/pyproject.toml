[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slidefinder"
version = "0.2.0"
description = "Find the slides and drifts in a RaceChrono session so you can pull the clips from your video."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "racelog>=0.1.0",
    "numpy",
    "pandas",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "playwright"]

[project.scripts]
slidefinder = "slidefinder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slidefinder = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
