[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lapcompare"
version = "0.1.0"
description = "Compare laps from RaceChrono sessions: overlay any signals against distance."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "racelog>=0.1.0",
    "numpy",
    "pandas",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "playwright"]

[project.scripts]
lapcompare = "lapcompare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lapcompare = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
